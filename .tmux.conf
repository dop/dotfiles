# Bottom status bar: grey background, white text
set -g status-position bottom
set -g status-style 'bg=colour250,fg=black'

# Omit window flags (* for active, - for previous)
setw -g window-status-format '#I:#W'
# Add padding around the active entry, also without flags
setw -g window-status-current-format ' #I:#W '

# Inactive window entries inherit the bar's colours
setw -g window-status-style 'bg=default,fg=default'

# Active window entry: blue background, white text
setw -g window-status-current-style 'bg=blue,fg=white'
